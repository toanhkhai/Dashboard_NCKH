<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/logo/logo.png" />
  <title>Dashboard Nghiên Cứu Khoa Học CTUMP</title>
  <meta name="description"
    content="Cổng quản lý và trực quan hóa dữ liệu nghiên cứu khoa học Đại học Y Dược Cần Thơ (CTUMP) với đồng bộ Google Sheets" />
  <meta property="og:title" content="Dashboard Nghiên Cứu Khoa Học CTUMP" />
  <meta property="og:description"
    content="Cổng quản lý và trực quan hóa dữ liệu nghiên cứu khoa học Đại học Y Dược Cần Thơ (CTUMP) với đồng bộ Google Sheets" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet">
  <!-- Google Identity Services (Sign In with Google) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body
  class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen selection:bg-emerald-500 selection:text-white">
  <div id="root">
    <style>
      .initial-splash-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #f8fafc;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #1e293b;
        z-index: 99999;
      }
      .splash-logo-wrap {
        position: relative;
        width: 84px;
        height: 84px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .splash-spinner {
        position: absolute;
        inset: 0;
        border: 3.5px solid #e2e8f0;
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: splashSpin 0.9s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
      }
      .splash-logo {
        width: 48px;
        height: 48px;
        object-fit: contain;
      }
      .splash-title {
        margin-top: 22px;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: #0f172a;
      }
      .splash-subtitle {
        margin-top: 4px;
        font-size: 12px;
        color: #64748b;
      }
      .splash-bar-wrap {
        width: 140px;
        height: 3px;
        background: #e2e8f0;
        border-radius: 999px;
        overflow: hidden;
        margin-top: 18px;
      }
      .splash-bar {
        height: 100%;
        width: 45%;
        background: #2563eb;
        border-radius: 999px;
        animation: splashProgress 1.3s ease-in-out infinite;
      }
      @keyframes splashSpin {
        to { transform: rotate(360deg); }
      }
      @keyframes splashProgress {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(120%); width: 55%; }
        100% { transform: translateX(300%); }
      }
    </style>
    <div class="initial-splash-loader">
      <div class="splash-logo-wrap">
        <div class="splash-spinner"></div>
        <img class="splash-logo" src="/logo/logo.png" alt="CTUMP Logo" />
      </div>
      <div class="splash-title">Đang tải dữ liệu...</div>
      <div class="splash-bar-wrap">
        <div class="splash-bar"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
